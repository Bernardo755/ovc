<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extractor OCR - Fotos y Cámara</title>
    <!-- Librerías necesarias -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; }
        .app-container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin-bottom: 30px; }
        .canvas-container { position: relative; overflow: hidden; border: 2px solid #ccc; background: #222; width: 100%; height: 500px; cursor: crosshair; margin-bottom: 15px; }
        .wrapper { transform-origin: 0 0; position: absolute; }
        .preview-img { display: block; max-width: none; }
        video { display: block; max-width: none; }
        .selection-box { position: absolute; border: 2px dashed #00ff00; background: rgba(0, 255, 0, 0.2); display: none; pointer-events: none; }
        .zoom-selection-box { position: absolute; border: 2px dashed #00bfff; background: rgba(0, 191, 255, 0.2); display: none; pointer-events: none; }
        .saved-box { position: absolute; border: 2px solid #ff0000; background: rgba(255, 0, 0, 0.2); color: white; font-weight: bold; font-size: 12px; pointer-events: none; display: flex; align-items: flex-start; justify-content: flex-start; padding: 2px; }
        .controls, .form-inputs { margin-bottom: 15px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
        button, select, input[type="file"], input[type="text"] { padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        button { background-color: #007bff; color: white; cursor: pointer; border: none; }
        button:hover { background-color: #0056b3; }
        button.danger { background-color: #dc3545; }
        button.danger:hover { background-color: #c82333; }
        .status-bar { padding: 10px; background: #e9ecef; border-radius: 4px; font-weight: bold; margin-bottom: 15px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>

    <!-- SECCIÓN 1: LOTE DE FOTOS -->
    <div class="app-container" id="app-1">
        <h2>📁 Modo Lote de Fotos</h2>
        
        <div class="controls">
            <input type="file" id="file-input-1" multiple accept="image/*" onchange="appFotos.cargarImagenes(event)">
            <button onclick="appFotos.cambiarModo('seleccionar')">🎯 Modo Selección</button>
            <button onclick="appFotos.cambiarModo('navegar')">✋ Modo Navegar</button>
            <button onclick="appFotos.cambiarModo('zoom-area')">🔍 Zoom Área</button>
            <button onclick="appFotos.resetZoom()">🔄 Reset Zoom</button>
            <button onclick="appFotos.reiniciarRecuadrosActuales()">🔄 Reubicar Recuadros</button>
        </div>

        <div class="status-bar" id="queue-banner-1" style="display:none; justify-content: space-between;">
            <span id="queue-text-1"></span>
            <span id="current-filename-1"></span>
        </div>
        <div id="loading-status-1" class="status-bar">Sube fotos o una carpeta para comenzar.</div>

        <div id="container-1" class="canvas-container">
            <div id="wrapper-1" class="wrapper">
                <span style="color: #fff; padding: 20px; display: block;">Sin imágenes cargadas</span>
                <div id="sel-box-1" class="selection-box"></div>
                <div id="zoom-box-1" class="zoom-selection-box"></div>
            </div>
        </div>

        <div class="form-inputs">
            <label>R0 (ID / Ref): <input type="text" id="rango-1-0"></label>
            <label>R1: <input type="text" id="rango-1-1" readonly></label>
            <label>R2: <input type="text" id="rango-1-2" readonly></label>
            <label>R3: <input type="text" id="rango-1-3" readonly></label>
            <span>Recuadro activo a dibujar: <b id="active-box-label-1">1</b></span>
        </div>

        <div class="controls">
            <button onclick="appFotos.ejecutarProcesoYpasarSiguiente()" style="background-color: #28a745;">▶️ Procesar OCR y Siguiente</button>
            <button onclick="appFotos.exportarExcel()" style="background-color: #17a2b8;">💾 Exportar a Excel</button>
            <button class="danger" onclick="appFotos.limpiarTodoApp()">🗑️ Limpiar Todo</button>
        </div>

        <table id="tabla-resultados-1">
            <thead>
                <tr>
                    <th>Archivo</th><th>R0</th><th>R1</th><th>R2</th><th>R3</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <!-- SECCIÓN 2: CÁMARA WEB -->
    <div class="app-container" id="app-2">
        <h2>📷 Modo Cámara Web</h2>
        
        <div class="controls">
            <select id="select-camara">
                <option value="">Cámara por defecto</option>
            </select>
            <button onclick="appCamara.iniciarCamara()">🟢 Iniciar Cámara</button>
            <button onclick="appCamara.apagarCamara()" class="danger">🔴 Detener Cámara</button>
            <button onclick="appCamara.cambiarModo('seleccionar')">🎯 Modo Selección</button>
            <button onclick="appCamara.cambiarModo('navegar')">✋ Modo Navegar</button>
            <button onclick="appCamara.cambiarModo('zoom-area')">🔍 Zoom Área</button>
            <button onclick="appCamara.resetZoom()">🔄 Reset Zoom</button>
            <button onclick="appCamara.reiniciarRecuadrosActuales()">🔄 Reubicar Recuadros</button>
        </div>

        <div id="loading-status-2" class="status-bar">Cámara apagada. Enciéndela para comenzar.</div>

        <div id="container-2" class="canvas-container">
            <div id="wrapper-2" class="wrapper">
                <video id="cam-video" autoplay playsinline style="pointer-events: none;"></video>
                <div id="sel-box-2" class="selection-box"></div>
                <div id="zoom-box-2" class="zoom-selection-box"></div>
            </div>
        </div>

        <div class="form-inputs">
            <label>R0 (ID / Ref): <input type="text" id="rango-2-0"></label>
            <label>R1: <input type="text" id="rango-2-1" readonly></label>
            <label>R2: <input type="text" id="rango-2-2" readonly></label>
            <label>R3: <input type="text" id="rango-2-3" readonly></label>
            <span>Recuadro activo a dibujar: <b id="active-box-label-2">1</b></span>
        </div>

        <div class="controls">
            <button onclick="appCamara.ejecutarProcesoCamara()" style="background-color: #28a745;">📸 Capturar y Procesar OCR</button>
            <button onclick="appCamara.exportarExcel()" style="background-color: #17a2b8;">💾 Exportar a Excel</button>
            <button class="danger" onclick="appCamara.limpiarTodoApp()">🗑️ Limpiar Todo</button>
        </div>

        <table id="tabla-resultados-2">
            <thead>
                <tr>
                    <th>Captura / Hora</th><th>R0</th><th>R1</th><th>R2</th><th>R3</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        // PARTE 1 Y PARTE 2 INTEGRADAS EN LA CLASE
        class ExtractorOCRApp {
            constructor(id, esCamara) {
                this.id = id;
                this.esCamara = esCamara;
                
                // Configuración
                this.totalRangos = 3; 
                this.tablaData = [];
                this.recuadrosActuales = [];
                this.listaImagenes = [];
                this.indiceActual = 0;
                
                // Elementos multimedia y de transformación
                this.mediaElement = null;
                this.streamCamara = null;
                this.scale = 1;
                this.panX = 0;
                this.panY = 0;
                
                // Estados de interacción
                this.isDrawing = false;
                this.isDraggingImage = false;
                this.startX = 0;
                this.startY = 0;
                this.startPanX = 0;
                this.startPanY = 0;
                this.modoActual = 'seleccionar';
            }

            init() {
                this.actualizarUIformulario();
                if (this.esCamara) {
                    this.obtenerDispositivosCamara();
                }
            }

            async obtenerDispositivosCamara() {
                try {
                    const devices = await navigator.mediaDevices.enumerateDevices();
                    const videoDevices = devices.filter(device => device.kind === 'videoinput');
                    const select = document.getElementById('select-camara');
                    videoDevices.forEach(device => {
                        const option = document.createElement('option');
                        option.value = device.deviceId;
                        option.text = device.label || `Cámara ${select.length + 1}`;
                        select.appendChild(option);
                    });
                } catch (error) {
                    console.error("Error obteniendo cámaras:", error);
                }
            }

            cambiarModo(modo) {
                this.modoActual = modo;
                const container = document.getElementById(`container-${this.id}`);
                if (modo === 'navegar') {
                    container.style.cursor = 'grab';
                } else {
                    container.style.cursor = 'crosshair';
                }
            }

            limpiarVisualesRecuadros() {
                const wrapper = document.getElementById(`wrapper-${this.id}`);
                const boxes = wrapper.querySelectorAll('.saved-box');
                boxes.forEach(box => box.remove());
            }

            redibujarRecuadrosEnPantalla() {
                this.limpiarVisualesRecuadros();
                const wrapper = document.getElementById(`wrapper-${this.id}`);
                this.recuadrosActuales.forEach((boxData, i) => {
                    const permBox = document.createElement('div');
                    permBox.className = 'saved-box';
                    permBox.style.left = boxData.left + 'px';
                    permBox.style.top = boxData.top + 'px';
                    permBox.style.width = boxData.width + 'px';
                    permBox.style.height = boxData.height + 'px';
                    permBox.innerHTML = `<span>R${i + 1}</span>`;
                    wrapper.appendChild(permBox);
                });
            }

            renderizarTablaHTML() {
                const tbody = document.querySelector(`#tabla-resultados-${this.id} tbody`);
                tbody.innerHTML = '';
                this.tablaData.forEach(row => {
                    const tr = document.createElement('tr');
                    
                    const tdArchivo = document.createElement('td');
                    tdArchivo.innerText = row["Archivo"] || row["Captura / Hora"];
                    tr.appendChild(tdArchivo);
                    
                    const tdR0 = document.createElement('td');
                    tdR0.innerText = row["R0"] || '';
                    tr.appendChild(tdR0);
                    
                    for (let i = 1; i <= this.totalRangos; i++) {
                        const td = document.createElement('td');
                        td.innerText = row[`R${i}`] || '';
                        tr.appendChild(td);
                    }
                    tbody.appendChild(tr);
                });
            }

            // ==========================================
            // CÓDIGO PROPORCIONADO POR EL USUARIO (PARTE 2)
            // ==========================================
            limpiarTodoApp() {
                if (!confirm("¿Estás seguro de que deseas limpiar todo (tabla, imágenes y recuadros guardados)?")) return;

                this.tablaData = [];
                this.renderizarTablaHTML();
                this.recuadrosActuales = [];

                if (!this.esCamara) {
                    this.listaImagenes = [];
                    this.indiceActual = 0;
                    const wrapper = document.getElementById(`wrapper-${this.id}`);
                    wrapper.innerHTML = `<span style="color: #fff; padding: 20px; display: block;">Sin imágenes cargadas</span><div id="sel-box-${this.id}" class="selection-box"></div><div id="zoom-box-${this.id}" class="zoom-selection-box"></div>`;
                    document.getElementById(`queue-banner-${this.id}`).style.display = 'none';
                    document.getElementById(`loading-status-${this.id}`).innerText = "Sube fotos o una carpeta para comenzar.";
                } else {
                    this.apagarCamara();
                    document.getElementById(`loading-status-${this.id}`).innerText = "Cámara apagada y datos limpiados.";
                }

                for(let i=0; i<=this.totalRangos; i++) {
                    const input = document.getElementById(`rango-${this.id}-${i}`);
                    if(input) input.value = '';
                }
                this.actualizarUIformulario();
            }

            cargarImagenes(event) {
                const files = Array.from(event.target.files).filter(file => file.type.startsWith('image/'));
                if (files.length === 0) return;

                this.listaImagenes = [];
                let cargados = 0;

                files.forEach((file) => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        this.listaImagenes.push({
                            file: file,
                            name: file.name,
                            src: e.target.result
                        });
                        cargados++;
                        if (cargados === files.length) {
                            this.listaImagenes.sort((a, b) => a.name.localeCompare(b.name));
                            this.indiceActual = 0;
                            this.mostrarFotoActual();
                        }
                    };
                    reader.readAsDataURL(file);
                });
            }

            mostrarFotoActual() {
                if (this.listaImagenes.length === 0) return;

                if (this.indiceActual >= this.listaImagenes.length) {
                    this.indiceActual = this.listaImagenes.length - 1;
                }

                const foto = this.listaImagenes[this.indiceActual];
                const wrapper = document.getElementById(`wrapper-${this.id}`);
                
                wrapper.innerHTML = `
                    <img id="preview-img-${this.id}" class="preview-img" src="${foto.src}" alt="${foto.name}">
                    <div id="sel-box-${this.id}" class="selection-box"></div>
                    <div id="zoom-box-${this.id}" class="zoom-selection-box"></div>
                `;

                document.getElementById(`queue-banner-${this.id}`).style.display = 'flex';
                document.getElementById(`queue-text-${this.id}`).innerText = `Foto ${this.indiceActual + 1} de ${this.listaImagenes.length}`;
                document.getElementById(`current-filename-${this.id}`).innerText = `📁 ${foto.name}`;

                this.mediaElement = document.getElementById(`preview-img-${this.id}`);

                this.mediaElement.onload = () => {
                    this.resetZoom();
                    this.configurarInteraccionCanvas();
                    
                    if (this.recuadrosActuales.length === this.totalRangos) {
                        this.redibujarRecuadrosEnPantalla();
                        document.getElementById(`loading-status-${this.id}`).innerText = `✅ Foto cargada. Usando ${this.totalRangos} recuadros guardados previamente.`;
                    } else {
                        document.getElementById(`loading-status-${this.id}`).innerText = `✏️ Dibuja los recuadros (${this.recuadrosActuales.length}/${this.totalRangos}).`;
                    }
                    this.actualizarUIformulario();
                };
            }

            async iniciarCamara() {
                try {
                    this.apagarCamara();
                    const selectCam = document.getElementById(`select-camara`);
                    const deviceIdSelected = selectCam.value;

                    const constraints = {
                        video: deviceIdSelected ? { deviceId: { exact: deviceIdSelected } } : { width: { ideal: 1280 }, height: { ideal: 720 } }
                    };

                    this.streamCamara = await navigator.mediaDevices.getUserMedia(constraints);
                    this.mediaElement = document.getElementById(`cam-video`);
                    this.mediaElement.srcObject = this.streamCamara;
                    
                    this.resetZoom();
                    this.configurarInteraccionCanvas();

                    if (this.recuadrosActuales.length === this.totalRangos) {
                        this.redibujarRecuadrosEnPantalla();
                        document.getElementById(`loading-status-${this.id}`).innerText = "✅ Cámara activa. Usando recuadros guardados.";
                    } else {
                        document.getElementById(`loading-status-${this.id}`).innerText = `✏️ Cámara activa. Dibuja los recuadros (${this.recuadrosActuales.length}/${this.totalRangos}).`;
                    }
                    this.actualizarUIformulario();
                } catch (err) {
                    console.error(err);
                    alert("No se pudo iniciar la cámara seleccionada.");
                }
            }

            apagarCamara() {
                if (this.streamCamara) {
                    this.streamCamara.getTracks().forEach(track => track.stop());
                    this.streamCamara = null;
                }
                const videoEl = document.getElementById(`cam-video`);
                if (videoEl) videoEl.srcObject = null;
                document.getElementById(`loading-status-${this.id}`).innerText = "⏹️ Cámara apagada.";
            }

            resetZoom() {
                this.scale = 1;
                this.panX = 0;
                this.panY = 0;
                this.actualizarTransformacionCanvas();
            }

            actualizarTransformacionCanvas() {
                const wrapper = document.getElementById(`wrapper-${this.id}`);
                if (wrapper) {
                    wrapper.style.transform = `translate(${this.panX}px, ${this.panY}px) scale(${this.scale})`;
                }
            }

            configurarInteraccionCanvas() {
                const container = document.getElementById(`container-${this.id}`);
                const wrapper = document.getElementById(`wrapper-${this.id}`);
                const selectionBox = document.getElementById(`sel-box-${this.id}`);
                const zoomBox = document.getElementById(`zoom-box-${this.id}`);

                container.onwheel = (e) => {
                    e.preventDefault();
                    if (!this.mediaElement) return;

                    const rect = container.getBoundingClientRect();
                    const mouseX = e.clientX - rect.left;
                    const mouseY = e.clientY - rect.top;

                    const zoomFactor = 1.15;
                    let oldScale = this.scale;

                    if (e.deltaY < 0) {
                        this.scale *= zoomFactor;
                    } else {
                        this.scale /= zoomFactor;
                    }

                    this.scale = Math.max(0.5, Math.min(this.scale, 15));
                    this.panX = mouseX - (mouseX - this.panX) * (this.scale / oldScale);
                    this.panY = mouseY - (mouseY - this.panY) * (this.scale / oldScale);

                    this.actualizarTransformacionCanvas();
                };

                container.onmousedown = (e) => {
                    if (!this.mediaElement) return;

                    if (e.button === 0) {
                        if (this.modoActual === 'navegar') {
                            this.isDraggingImage = true;
                            this.startPanX = e.clientX - this.panX;
                            this.startPanY = e.clientY - this.panY;
                            
                            document.addEventListener('mousemove', onMouseMoveGlobal);
                            document.addEventListener('mouseup', onMouseUpGlobal);
                            e.preventDefault();
                            return;
                        }

                        if (this.recuadrosActuales.length >= this.totalRangos && this.modoActual === 'seleccionar') {
                            return;
                        }

                        const rect = wrapper.getBoundingClientRect();
                        this.startX = (e.clientX - rect.left) / this.scale;
                        this.startY = (e.clientY - rect.top) / this.scale;
                        this.isDrawing = true;

                        let activeBox = (this.modoActual === 'zoom-area') ? zoomBox : selectionBox;
                        activeBox.style.left = this.startX + 'px';
                        activeBox.style.top = this.startY + 'px';
                        activeBox.style.width = '0px';
                        activeBox.style.height = '0px';
                        activeBox.style.display = 'block';

                        document.addEventListener('mousemove', onMouseMoveGlobal);
                        document.addEventListener('mouseup', onMouseUpGlobal);
                        e.preventDefault();
                    }
                };

                const onMouseMoveGlobal = (e) => {
                    if (this.isDraggingImage) {
                        this.panX = e.clientX - this.startPanX;
                        this.panY = e.clientY - this.startPanY;
                        this.actualizarTransformacionCanvas();
                        return;
                    }

                    if (!this.isDrawing) return;
                    const rect = wrapper.getBoundingClientRect();
                    let currentX = (e.clientX - rect.left) / this.scale;
                    let currentY = (e.clientY - rect.top) / this.scale;

                    const width = currentX - this.startX;
                    const height = currentY - this.startY;

                    let activeBox = (this.modoActual === 'zoom-area') ? zoomBox : selectionBox;
                    activeBox.style.width = Math.abs(width) + 'px';
                    activeBox.style.height = Math.abs(height) + 'px';
                    activeBox.style.left = (width < 0 ? currentX : this.startX) + 'px';
                    activeBox.style.top = (height < 0 ? currentY : this.startY) + 'px';
                };

                const onMouseUpGlobal = (e) => {
                    document.removeEventListener('mousemove', onMouseMoveGlobal);
                    document.removeEventListener('mouseup', onMouseUpGlobal);

                    if (this.isDraggingImage) {
                        this.isDraggingImage = false;
                        return;
                    }

                    if (!this.isDrawing) return;
                    this.isDrawing = false;

                    if (this.modoActual === 'zoom-area') {
                        const width = parseFloat(zoomBox.style.width);
                        const height = parseFloat(zoomBox.style.height);
                        zoomBox.style.display = 'none';

                        if (width > 5 && height > 5) {
                            const boxLeft = parseFloat(zoomBox.style.left);
                            const boxTop = parseFloat(zoomBox.style.top);
                            const containerWidth = container.clientWidth;
                            const containerHeight = container.clientHeight;

                            const scaleX = containerWidth / width;
                            const scaleY = containerHeight / height;
                            let newScale = Math.min(scaleX, scaleY);
                            newScale = Math.max(1, Math.min(newScale, 15));

                            this.scale = newScale;
                            this.panX = -boxLeft * this.scale + (containerWidth - width * this.scale) / 2;
                            this.panY = -boxTop * this.scale + (containerHeight - height * this.scale) / 2;

                            this.actualizarTransformacionCanvas();
                            this.cambiarModo('seleccionar');
                        }
                        return;
                    }

                    const width = parseFloat(selectionBox.style.width);
                    const height = parseFloat(selectionBox.style.height);
                    selectionBox.style.display = 'none';

                    if (width > 3 && height > 3) {
                        if (this.recuadrosActuales.length >= this.totalRangos) return;

                        const boxData = {
                            left: parseFloat(selectionBox.style.left),
                            top: parseFloat(selectionBox.style.top),
                            width: width,
                            height: height
                        };

                        this.recuadrosActuales.push(boxData);

                        const permBox = document.createElement('div');
                        permBox.className = 'saved-box';
                        permBox.style.left = boxData.left + 'px';
                        permBox.style.top = boxData.top + 'px';
                        permBox.style.width = boxData.width + 'px';
                        permBox.style.height = boxData.height + 'px';
                        permBox.innerHTML = `<span>R${this.recuadrosActuales.length}</span>`;
                        wrapper.appendChild(permBox);

                        this.actualizarUIformulario();

                        if (this.recuadrosActuales.length < this.totalRangos) {
                            document.getElementById(`loading-status-${this.id}`).innerText = `✅ Rango ${this.recuadrosActuales.length} guardado. Falta(n) ${this.totalRangos - this.recuadrosActuales.length}.`;
                        } else {
                            document.getElementById(`loading-status-${this.id}`).innerText = `🎉 ¡${this.totalRangos} recuadros guardados! Listos para procesar.`;
                        }
                    }
                };
            }

            actualizarUIformulario() {
                const siguienteRango = Math.min(this.recuadrosActuales.length + 1, this.totalRangos);
                document.getElementById(`active-box-label-${this.id}`).innerText = siguienteRango;
            }

            reiniciarRecuadrosActuales() {
                this.recuadrosActuales = [];
                this.limpiarVisualesRecuadros();
                const selBox = document.getElementById(`sel-box-${this.id}`);
                const zoomBox = document.getElementById(`zoom-box-${this.id}`);
                if (selBox) selBox.style.display = 'none';
                if (zoomBox) zoomBox.style.display = 'none';

                for(let i=1; i<=this.totalRangos; i++) {
                    const input = document.getElementById(`rango-${this.id}-${i}`);
                    if(input) input.value = '';
                }
                document.getElementById(`loading-status-${this.id}`).innerText = "🔄 MODO REUBICACIÓN: Dibuja los recuadros nuevamente.";
                this.actualizarUIformulario();
            }

            async ejecutarProcesoYpasarSiguiente() {
                if (this.listaImagenes.length === 0) {
                    alert("No hay imágenes cargadas."); return;
                }
                if (this.recuadrosActuales.length < this.totalRangos) {
                    alert(`Debes terminar de dibujar los ${this.totalRangos} recuadros.`); return;
                }
                if (this.indiceActual >= this.listaImagenes.length) {
                    this.indiceActual = 0;
                }

                const foto = this.listaImagenes[this.indiceActual];
                document.getElementById(`loading-status-${this.id}`).innerText = "⏳ Ejecutando OCR en los recuadros...";

                const scaleX = this.mediaElement.naturalWidth / this.mediaElement.width;
                const scaleY = this.mediaElement.naturalHeight / this.mediaElement.height;
                let resultadosOCR = new Array(this.totalRangos).fill('');

                try {
                    const worker = await Tesseract.createWorker('spa+eng');

                    for (let i = 0; i < this.totalRangos; i++) {
                        const b = this.recuadrosActuales[i];
                        const x = b.left * scaleX;
                        const y = b.top * scaleY;
                        const w = b.width * scaleX;
                        const h = b.height * scaleY;

                        const canvas = document.createElement('canvas');
                        canvas.width = w; canvas.height = h;
                        const ctx = canvas.getContext('2d');

                        const imageObj = new Image();
                        imageObj.src = foto.src;
                        
                        const textoRecorte = await new Promise((resolve) => {
                            imageObj.onload = async () => {
                                ctx.drawImage(imageObj, x, y, w, h, 0, 0, w, h);
                                const croppedDataUrl = canvas.toDataURL('image/png');
                                const ret = await worker.recognize(croppedDataUrl);
                                let texto = ret.data.text.trim();
                                
                                texto = texto.replace(/\s*@\s*/g, '@');
                                texto = texto.replace(/\s*\.\s*/g, '.');
                                texto = texto.replace(/([a-zA-Z0-9._%+-])\s+([a-zA-Z0-9._%+-])/g, '$1$2');
                                resolve(texto);
                            };
                        });

                        resultadosOCR[i] = textoRecorte;
                        document.getElementById(`rango-${this.id}-${i+1}`).value = textoRecorte;
                    }

                    await worker.terminate();

                    const valR0 = document.getElementById(`rango-${this.id}-0`).value.trim();
                    let rowData = { "Archivo": foto.name, "R0": valR0 };
                    for (let i = 0; i < this.totalRangos; i++) {
                        rowData[`R${i+1}`] = resultadosOCR[i];
                    }
                    this.tablaData.push(rowData);
                    this.renderizarTablaHTML();

                    document.getElementById(`rango-${this.id}-0`).value = '';
                    document.getElementById(`rango-${this.id}-0`).focus();

                    document.getElementById(`loading-status-${this.id}`).innerText = "✅ OCR Exitoso. Pasando a la siguiente...";

                    setTimeout(() => {
                        this.indiceActual++;
                        if (this.indiceActual < this.listaImagenes.length) {
                            this.mostrarFotoActual();
                        } else {
                            this.indiceActual = this.listaImagenes.length - 1;
                            document.getElementById(`loading-status-${this.id}`).innerText = "🏁 ¡Lote completado con éxito!";
                        }
                    }, 1000);

                } catch (err) {
                    console.error(err);
                    document.getElementById(`loading-status-${this.id}`).innerText = "❌ Error al ejecutar el OCR.";
                }
            }

            async ejecutarProcesoCamara() {
                if (this.recuadrosActuales.length < this.totalRangos) {
                    alert(`Debes terminar de dibujar los ${this.totalRangos} recuadros.`); return;
                }
                if (!this.streamCamara) {
                    alert("La cámara no está encendida."); return;
                }

                document.getElementById(`loading-status-${this.id}`).innerText = "⏳ Capturando y procesando...";

                const videoEl = document.getElementById(`cam-video`);
                const natW = videoEl.videoWidth || 1280;
                const natH = videoEl.videoHeight || 720;
                const clientW = videoEl.clientWidth;
                const clientH = videoEl.clientHeight;

                const scaleX = natW / clientW;
                const scaleY = natH / clientH;

                let resultadosOCR = new Array(this.totalRangos).fill('');

                try {
                    const worker = await Tesseract.createWorker('spa+eng');

                    for (let i = 0; i < this.totalRangos; i++) {
                        const b = this.recuadrosActuales[i];
                        const x = b.left * scaleX;
                        const y = b.top * scaleY;
                        const w = b.width * scaleX;
                        const h = b.height * scaleY;

                        const canvas = document.createElement('canvas');
                        canvas.width = w; canvas.height = h;
                        const ctx = canvas.getContext('2d');

                        ctx.drawImage(videoEl, x, y, w, h, 0, 0, w, h);
                        const croppedDataUrl = canvas.toDataURL('image/png');

                        const ret = await worker.recognize(croppedDataUrl);
                        let texto = ret.data.text.trim();
                        
                        texto = texto.replace(/\s*@\s*/g, '@');
                        texto = texto.replace(/\s*\.\s*/g, '.');
                        texto = texto.replace(/([a-zA-Z0-9._%+-])\s+([a-zA-Z0-9._%+-])/g, '$1$2');

                        resultadosOCR[i] = texto;
                        document.getElementById(`rango-${this.id}-${i+1}`).value = texto;
                    }

                    await worker.terminate();

                    const valR0 = document.getElementById(`rango-${this.id}-0`).value.trim();
                    const timestamp = new Date().toLocaleTimeString();
                    
                    let rowData = { "Captura / Hora": timestamp, "R0": valR0 };
                    for (let i = 0; i < this.totalRangos; i++) {
                        rowData[`R${i+1}`] = resultadosOCR[i];
                    }
                    this.tablaData.push(rowData);
                    this.renderizarTablaHTML();

                    document.getElementById(`rango-${this.id}-0`).value = '';
                    document.getElementById(`rango-${this.id}-0`).focus();

                    document.getElementById(`loading-status-${this.id}`).innerText = "✅ OCR de cámara completado.";

                } catch (err) {
                    console.error(err);
                    document.getElementById(`loading-status-${this.id}`).innerText = "❌ Error al procesar cámara.";
                }
            }

            exportarExcel() {
                if (this.tablaData.length === 0) {
                    alert("La tabla está vacía."); return;
                }
                const worksheet = XLSX.utils.json_to_sheet(this.tablaData);
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, "OCR_Datos");
                XLSX.writeFile(workbook, `Datos_OCR_${this.id === '1' ? 'LoteFotos' : 'Camara'}.xlsx`);
            }
        }

        // INICIALIZACIÓN
        const appFotos = new ExtractorOCRApp('1', false);
        const appCamara = new ExtractorOCRApp('2', true);

        window.onload = function() {
            appFotos.init();
            appCamara.init();
        }
    </script>
</body>
</html>
