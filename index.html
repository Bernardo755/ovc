<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extractor OCR Inteligente con OpenCV Avanzado</title>
    
    <!-- Tesseract, SheetJS y OpenCV.js -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script async src="https://docs.opencv.org/4.8.0/opencv.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #1e1e1e;
            --panel-bg: #2d2d2d;
            --text-color: #f0f0f0;
            --accent: #4a90e2;
            --accent-hover: #357abd;
            --border: #444;
            --success: #28a745;
            --danger: #dc3545;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .tabs {
            display: flex;
            background: #111;
            padding: 10px 20px 0;
            border-bottom: 2px solid var(--border);
        }

        .tab-btn {
            background: var(--panel-bg);
            color: #aaa;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 8px 8px 0 0;
            margin-right: 5px;
            transition: 0.3s;
        }

        .tab-btn.active {
            background: var(--accent);
            color: #fff;
        }

        .tab-content {
            display: none;
            flex: 1;
            height: calc(100vh - 50px);
        }

        .tab-content.active { display: flex; }

        .app-layout {
            display: flex;
            width: 100%;
            height: 100%;
        }

        .sidebar {
            width: 360px;
            background: var(--panel-bg);
            padding: 15px;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #000;
            position: relative;
        }

        .media-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: crosshair;
        }

        .media-wrapper {
            position: relative;
            transform-origin: 0 0;
        }

        .preview-img, video {
            display: block;
            max-width: none;
            pointer-events: none;
        }

        .selection-box {
            position: absolute; border: 2px dashed #ffeb3b; background: rgba(255, 235, 59, 0.2);
            pointer-events: none; display: none; z-index: 10;
        }
        .zoom-selection-box {
            position: absolute; border: 2px dashed #00bcd4; background: rgba(0, 188, 212, 0.2);
            pointer-events: none; display: none; z-index: 10;
        }
        .saved-box {
            position: absolute; border: 2px solid #4caf50; background: rgba(76, 175, 80, 0.2);
            pointer-events: none; z-index: 5; display: flex; justify-content: center; align-items: center;
            color: #fff; font-weight: bold; font-size: 11px; text-shadow: 1px 1px 2px #000;
        }

        input[type="text"], input[type="file"], input[type="number"], select {
            width: 100%; padding: 8px; background: #111; border: 1px solid var(--border);
            color: #fff; border-radius: 5px; outline: none; margin-bottom: 3px;
        }

        .btn {
            padding: 10px; border: none; border-radius: 5px; cursor: pointer;
            font-weight: bold; width: 100%; transition: 0.2s; color: #fff;
            display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        .btn-primary { background: var(--accent); }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-success { background: var(--success); }
        .btn-danger { background: var(--danger); }
        
        .toolbar {
            display: flex; gap: 5px; background: #1a1a1a; padding: 10px; border-bottom: 1px solid var(--border);
        }
        .toolbar .btn { width: auto; padding: 8px 15px; font-size: 14px; background: #333;}
        .toolbar .btn.active { background: var(--accent); }

        .table-container {
            height: 200px; background: var(--panel-bg); overflow: auto; border-top: 1px solid var(--border);
        }

        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 8px 12px; border: 1px solid var(--border); text-align: left; }
        th { background: #111; position: sticky; top: 0; }

        .status-bar {
            background: #111; padding: 8px 15px; font-size: 13px; color: #4caf50; font-weight: bold;
        }

        .section-box {
            background: #222; padding: 10px; border-radius: 6px; border: 1px solid #444;
        }
        .section-box h4 { margin: 0 0 6px 0; font-size: 12px; color: #ddd; display: flex; align-items: center; gap: 6px; }
        
        .dynamic-fields-container {
            max-height: 140px;
            overflow-y: auto;
            background: #1a1a1a;
            padding: 6px;
            border-radius: 4px;
            border: 1px solid #333;
        }
    </style>
</head>
<body>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('tab1')"><i class="fas fa-images"></i> Lote de Fotos</button>
        <button class="tab-btn" onclick="switchTab('tab2')"><i class="fas fa-camera"></i> Cámara en Vivo</button>
    </div>

    <div id="tab1" class="tab-content active"><div id="app-1" class="app-layout"></div></div>
    <div id="tab2" class="tab-content"><div id="app-2" class="app-layout"></div></div>

    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        class ExtractorOCRApp {
            constructor(id, esCamara) {
                this.id = id;
                this.esCamara = esCamara;
                this.totalRangos = 3;
                this.tablaData = [];
                this.recuadrosActuales = [];
                this.modoActual = 'seleccionar';
                this.scale = 1;
                this.panX = 0;
                this.panY = 0;
                this.isDrawing = false;
                this.isDraggingImage = false;
                this.mediaElement = null;
                this.streamCamara = null;
                this.listaImagenes = [];
                this.indiceActual = 0;
            }

            init() {
                this.setupHTML();
                this.configurarControlesBasicos();
                if (this.esCamara) this.poblarCamaras();
            }

            setupHTML() {
                const appContainer = document.getElementById(`app-${this.id}`);
                let inputArea = !this.esCamara 
                    ? `<label style="font-size:12px;">Subir Imágenes / Carpeta:</label><input type="file" id="file-upload-${this.id}" multiple accept="image/*">
                       <div id="queue-banner-${this.id}" style="display:none; background:#333; padding:6px; border-radius:4px; text-align:center;">
                           <span id="queue-text-${this.id}" style="font-weight:bold; color:var(--accent); font-size:12px;"></span><br>
                           <span id="current-filename-${this.id}" style="font-size:11px; color:#aaa;"></span>
                       </div>`
                    : `<label style="font-size:12px;">Cámara:</label><select id="select-camara"></select>
                       <div style="display:flex; gap:5px;">
                           <button class="btn btn-primary" id="btn-iniciar-cam-${this.id}" style="padding:6px;"><i class="fas fa-play"></i> Iniciar</button>
                           <button class="btn btn-danger" id="btn-apagar-cam-${this.id}" style="padding:6px;"><i class="fas fa-stop"></i> Apagar</button>
                       </div>`;

                appContainer.innerHTML = `
                    <div class="sidebar">
                        ${inputArea}
                        
                        <div>
                            <label style="color:var(--accent); font-weight:bold; font-size:12px;"><i class="fas fa-list-ol"></i> Cantidad de Campos (1 - 20):</label>
                            <input type="number" id="num-campos-${this.id}" min="1" max="20" value="3">
                        </div>

                        <!-- 1. BLOQUE: AJUSTES VISUALES DE BRILLO Y CONTRASTE -->
                        <div class="section-box">
                            <h4><i class="fas fa-adjust"></i> Ajuste Visual (Pantalla)</h4>
                            <label style="font-size: 11px;">Brillo Visual: <span id="val-brillo-${this.id}">100</span>%</label>
                            <input type="range" id="input-brillo-${this.id}" min="20" max="250" value="100" style="width:100%; cursor:pointer;">
                            
                            <label style="font-size: 11px;">Contraste Visual: <span id="val-contraste-${this.id}">100</span>%</label>
                            <input type="range" id="input-contraste-${this.id}" min="20" max="250" value="100" style="width:100%; cursor:pointer;">
                        </div>

                        <!-- 2. BLOQUE: MEJORAS DE IMAGEN ACTIVAS CON OPENCV -->
                        <div class="section-box" style="border-color: #4a90e2;">
                            <h4><i class="fas fa-microchip"></i> Motor de OpenCV Activo</h4>
                            <label style="font-size: 11px; display:flex; align-items:center; cursor:pointer; margin-bottom:4px;">
                                <input type="checkbox" id="cv-gris-${this.id}" checked style="margin-right:6px; cursor:pointer;"> 1. Convertir a Escala de Grises
                            </label>
                            <label style="font-size: 11px; display:flex; align-items:center; cursor:pointer; margin-bottom:4px;">
                                <input type="checkbox" id="cv-otsu-${this.id}" checked style="margin-right:6px; cursor:pointer;"> 2. Binarización Umbral Otsu
                            </label>
                            <label style="font-size: 11px; display:flex; align-items:center; cursor:pointer;">
                                <input type="checkbox" id="cv-denoise-${this.id}" style="margin-right:6px; cursor:pointer;"> 3. Reducción Avanzada de Ruido
                            </label>
                        </div>

                        <div>
                            <label style="color:#ffeb3b; font-size:12px;"><i class="fas fa-keyboard"></i> R0 (Referencia Manual):</label>
                            <input type="text" id="rango-${this.id}-0" placeholder="Referencia...">
                        </div>
                        
                        <div class="section-box">
                            <h4 style="justify-content: center;">Resultados OCR por Campos</h4>
                            <div class="dynamic-fields-container" id="dynamic-inputs-container-${this.id}"></div>
                        </div>

                        <button id="btn-ejecutar-${this.id}" class="btn btn-success"><i class="fas fa-bolt"></i> Ejecutar OCR</button>
                        <button id="btn-reubicar-${this.id}" class="btn" style="background:#e67e22;"><i class="fas fa-sync-alt"></i> Redibujar Recuadros</button>
                        <button id="btn-exportar-${this.id}" class="btn btn-primary"><i class="fas fa-file-excel"></i> Exportar Excel</button>
                        <button id="btn-limpiar-${this.id}" class="btn btn-danger"><i class="fas fa-trash-alt"></i> Limpiar Todo</button>
                    </div>
                    
                    <div class="main-content">
                        <div class="toolbar">
                            <button class="btn active" id="mode-sel-${this.id}" onclick="app${this.id === '1' ? 'Fotos' : 'Camara'}.cambiarModo('seleccionar')"><i class="fas fa-vector-square"></i> Dibujar (R<span id="active-box-label-${this.id}">1</span>)</button>
                            <button class="btn" id="mode-nav-${this.id}" onclick="app${this.id === '1' ? 'Fotos' : 'Camara'}.cambiarModo('navegar')"><i class="fas fa-hand-paper"></i> Navegar</button>
                            <button class="btn" id="mode-zoom-${this.id}" onclick="app${this.id === '1' ? 'Fotos' : 'Camara'}.cambiarModo('zoom-area')"><i class="fas fa-search-plus"></i> Zoom Área</button>
                            <button class="btn" onclick="app${this.id === '1' ? 'Fotos' : 'Camara'}.resetZoom()"><i class="fas fa-expand"></i> Reset</button>
                        </div>

                        <div class="media-container" id="container-${this.id}">
                            <div class="media-wrapper" id="wrapper-${this.id}">
                                ${this.esCamara ? `<video id="cam-video" autoplay playsinline></video>` : `<span style="color: #666; padding: 20px;">Sube imágenes...</span>`}
                                <div id="sel-box-${this.id}" class="selection-box"></div>
                                <div id="zoom-box-${this.id}" class="zoom-selection-box"></div>
                            </div>
                        </div>

                        <div class="status-bar" id="loading-status-${this.id}">Sistema listo.</div>

                        <div class="table-container">
                            <table id="tabla-${this.id}">
                                <thead>
                                    <tr id="table-head-tr-${this.id}">
                                        <th>${this.esCamara ? 'Captura / Hora' : 'Archivo'}</th>
                                        <th>R0 (Manual)</th>
                                    </tr>
                                </thead>
                                <tbody></tbody>
                            </table>
                        </div>
                    </div>
                `;
            }

            configurarControlesBasicos() {
                if (!this.esCamara) {
                    document.getElementById(`file-upload-${this.id}`).addEventListener('change', (e) => this.cargarImagenes(e));
                    document.getElementById(`btn-ejecutar-${this.id}`).addEventListener('click', () => this.ejecutarProcesoYpasarSiguiente());
                } else {
                    document.getElementById(`btn-iniciar-cam-${this.id}`).addEventListener('click', () => this.iniciarCamara());
                    document.getElementById(`btn-apagar-cam-${this.id}`).addEventListener('click', () => this.apagarCamara());
                    document.getElementById(`btn-ejecutar-${this.id}`).addEventListener('click', () => this.ejecutarProcesoCamara());
                }

                document.getElementById(`btn-reubicar-${this.id}`).addEventListener('click', () => this.reiniciarRecuadrosActuales());
                document.getElementById(`btn-exportar-${this.id}`).addEventListener('click', () => this.exportarExcel());
                document.getElementById(`btn-limpiar-${this.id}`).addEventListener('click', () => this.limpiarTodoApp());

                document.getElementById(`num-campos-${this.id}`).addEventListener('change', (e) => {
                    let val = parseInt(e.target.value);
                    if (val < 1) val = 1; if (val > 20) val = 20;
                    e.target.value = val;
                    this.totalRangos = val;
                    this.actualizarInputsDinamicosYTabla();
                    if (this.recuadrosActuales.length > this.totalRangos) {
                        this.recuadrosActuales = this.recuadrosActuales.slice(0, this.totalRangos);
                        this.redibujarRecuadrosEnPantalla();
                    }
                    this.actualizarUIformulario();
                });

                ['brillo', 'contraste'].forEach(tipo => {
                    document.getElementById(`input-${tipo}-${this.id}`).addEventListener('input', (e) => {
                        document.getElementById(`val-${tipo}-${this.id}`).innerText = e.target.value;
                        this.actualizarFiltroVisualPantalla();
                    });
                });

                this.actualizarInputsDinamicosYTabla();
            }

            actualizarFiltroVisualPantalla() {
                const b = document.getElementById(`input-brillo-${this.id}`).value;
                const c = document.getElementById(`input-contraste-${this.id}`).value;
                if (this.mediaElement) {
                    this.mediaElement.style.filter = `brightness(${b}%) contrast(${c}%)`;
                }
            }

            actualizarInputsDinamicosYTabla() {
                const container = document.getElementById(`dynamic-inputs-container-${this.id}`);
                container.innerHTML = '';
                for (let i = 1; i <= this.totalRangos; i++) {
                    container.innerHTML += `
                        <div style="margin-bottom:4px;">
                            <label style="font-size:10px; color:#aaa;">Rango ${i}:</label>
                            <input type="text" id="rango-${this.id}-${i}" readonly style="background:#111; color:#4caf50; font-weight:bold; padding:4px; font-size:11px;">
                        </div>
                    `;
                }

                const trHead = document.getElementById(`table-head-tr-${this.id}`);
                let htmlTh = `<th>${this.esCamara ? 'Captura / Hora' : 'Archivo'}</th><th>R0</th>`;
                for (let i = 1; i <= this.totalRangos; i++) htmlTh += `<th>R${i}</th>`;
                trHead.innerHTML = htmlTh;
                this.tablaData = [];
                this.renderizarTablaHTML();
            }

            async poblarCamaras() {
                try {
                    const devices = await navigator.mediaDevices.enumerateDevices();
                    const videoDevices = devices.filter(d => d.kind === 'videoinput');
                    document.getElementById(`select-camara`).innerHTML = videoDevices.map(d => `<option value="${d.deviceId}">${d.label || 'Cámara'}</option>`).join('');
                } catch (e) { console.error(e); }
            }

            aplicarMejorasOpenCV(canvasSource) {
                if (typeof cv === 'undefined' || !cv.Mat) {
                    console.warn("OpenCV cargando...");
                    return canvasSource.toDataURL('image/png');
                }

                try {
                    let src = cv.imread(canvasSource);
                    let dst = new cv.Mat();

                    let usarGris = document.getElementById(`cv-gris-${this.id}`).checked;
                    let usarOtsu = document.getElementById(`cv-otsu-${this.id}`).checked;
                    let usarDenoise = document.getElementById(`cv-denoise-${this.id}`).checked;

                    if (usarGris || usarOtsu) {
                        cv.cvtColor(src, dst, cv.COLOR_RGBA2GRAY, 0);
                    } else {
                        src.copyTo(dst);
                    }

                    if (usarDenoise) {
                        let tmp = new cv.Mat();
                        cv.bilateralFilter(dst, tmp, 9, 75, 75);
                        dst.delete();
                        dst = tmp;
                    }

                    if (usarOtsu) {
                        let tmp = new cv.Mat();
                        if (!usarGris && !usarDenoise) {
                            cv.cvtColor(dst, tmp, cv.COLOR_RGBA2GRAY, 0);
                            cv.threshold(tmp, dst, 0, 255, cv.THRESH_BINARY + cv.THRESH_OTSU);
                            tmp.delete();
                        } else {
                            cv.threshold(dst, tmp, 0, 255, cv.THRESH_BINARY + cv.THRESH_OTSU);
                            dst.delete();
                            dst = tmp;
                        }
                    }

                    cv.imshow(canvasSource, dst);
                    src.delete();
                    dst.delete();
                } catch (err) {
                    console.error("Error aplicando OpenCV:", err);
                }

                return canvasSource.toDataURL('image/png');
            }

            cambiarModo(modo) {
                this.modoActual = modo;
                document.getElementById(`mode-sel-${this.id}`).classList.remove('active');
                document.getElementById(`mode-nav-${this.id}`).classList.remove('active');
                document.getElementById(`mode-zoom-${this.id}`).classList.remove('active');
                
                let btnId = modo === 'seleccionar' ? `mode-sel-${this.id}` : (modo === 'navegar' ? `mode-nav-${this.id}` : `mode-zoom-${this.id}`);
                document.getElementById(btnId).classList.add('active');
                document.getElementById(`container-${this.id}`).style.cursor = modo === 'navegar' ? 'grab' : (modo === 'zoom-area' ? 'zoom-in' : 'crosshair');
            }

            renderizarTablaHTML() {
                const tbody = document.querySelector(`#tabla-${this.id} tbody`);
                tbody.innerHTML = '';
                this.tablaData.forEach(row => {
                    const tr = document.createElement('tr');
                    const keyMain = this.esCamara ? 'Captura / Hora' : 'Archivo';
                    let htmlTd = `<td>${row[keyMain] || ''}</td><td>${row['R0'] || ''}</td>`;
                    for(let i=1; i<=this.totalRangos; i++) htmlTd += `<td>${row[`R${i}`] || ''}</td>`;
                    tr.innerHTML = htmlTd;
                    tbody.appendChild(tr);
                });
                tbody.parentElement.parentElement.scrollTop = tbody.parentElement.parentElement.scrollHeight;
            }

            redibujarRecuadrosEnPantalla() {
                this.limpiarVisualesRecuadros();
                const wrapper = document.getElementById(`wrapper-${this.id}`);
                this.recuadrosActuales.forEach((b, index) => {
                    const permBox = document.createElement('div');
                    permBox.className = 'saved-box';
                    permBox.style.left = b.left + 'px'; permBox.style.top = b.top + 'px';
                    permBox.style.width = b.width + 'px'; permBox.style.height = b.height + 'px';
                    permBox.innerHTML = `<span>R${index + 1}</span>`;
                    wrapper.appendChild(permBox);
                });
            }

            limpiarVisualesRecuadros() {
                const wrapper = document.getElementById(`wrapper-${this.id}`);
                if (wrapper) wrapper.querySelectorAll('.saved-box').forEach(box => box.remove());
            }

            limpiarTodoApp() {
                if (!confirm("¿Deseas limpiar todos los registros?")) return;
                this.tablaData = [];
                this.renderizarTablaHTML();
                this.recuadrosActuales = [];
                this.reiniciarRecuadrosActuales();
                if (!this.esCamara) {
                    this.listaImagenes = [];
                    this.indiceActual = 0;
                    document.getElementById(`wrapper-${this.id}`).innerHTML = `<span style="color: #fff; padding: 20px;">Sin imágenes</span><div id="sel-box-${this.id}" class="selection-box"></div><div id="zoom-box-${this.id}" class="zoom-selection-box"></div>`;
                    document.getElementById(`queue-banner-${this.id}`).style.display = 'none';
                } else {
                    this.apagarCamara();
                }
                document.getElementById(`rango-${this.id}-0`).value = '';
            }

            cargarImagenes(event) {
                const files = Array.from(event.target.files).filter(file => file.type.startsWith('image/'));
                if (files.length === 0) return;
                this.listaImagenes = [];
                let cargados = 0;
                files.forEach((file) => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        this.listaImagenes.push({ file: file, name: file.name, src: e.target.result });
                        cargados++;
                        if (cargados === files.length) {
                            this.listaImagenes.sort((a, b) => a.name.localeCompare(b.name));
                            this.indiceActual = 0;
                            this.mostrarFotoActual();
                        }
                    };
                    reader.readAsDataURL(file);
                });
            }

            mostrarFotoActual() {
                if (this.listaImagenes.length === 0) return;
                if (this.indiceActual >= this.listaImagenes.length) this.indiceActual = this.listaImagenes.length - 1;
                const foto = this.listaImagenes[this.indiceActual];
                const wrapper = document.getElementById(`wrapper-${this.id}`);
                wrapper.innerHTML = `
                    <img id="preview-img-${this.id}" class="preview-img" src="${foto.src}" alt="${foto.name}">
                    <div id="sel-box-${this.id}" class="selection-box"></div>
                    <div id="zoom-box-${this.id}" class="zoom-selection-box"></div>
                `;
                document.getElementById(`queue-banner-${this.id}`).style.display = 'block';
                document.getElementById(`queue-text-${this.id}`).innerText = `Foto ${this.indiceActual + 1} de ${this.listaImagenes.length}`;
                document.getElementById(`current-filename-${this.id}`).innerText = `📁 ${foto.name}`;

                this.mediaElement = document.getElementById(`preview-img-${this.id}`);
                this.mediaElement.onload = () => {
                    this.resetZoom();
                    this.actualizarFiltroVisualPantalla();
                    this.configurarInteraccionCanvas();
                    if (this.recuadrosActuales.length === this.totalRangos) this.redibujarRecuadrosEnPantalla();
                    this.actualizarUIformulario();
                };
            }

            async iniciarCamara() {
                try {
                    this.apagarCamara();
                    const deviceId = document.getElementById(`select-camara`).value;
                    this.streamCamara = await navigator.mediaDevices.getUserMedia({
                        video: deviceId ? { deviceId: { exact: deviceId } } : { width: { ideal: 1280 }, height: { ideal: 720 } }
                    });
                    const wrapper = document.getElementById(`wrapper-${this.id}`);
                    wrapper.innerHTML = `
                        <video id="cam-video" autoplay playsinline></video>
                        <div id="sel-box-${this.id}" class="selection-box"></div>
                        <div id="zoom-box-${this.id}" class="zoom-selection-box"></div>
                    `;
                    this.mediaElement = document.getElementById(`cam-video`);
                    this.mediaElement.srcObject = this.streamCamara;
                    this.resetZoom();
                    this.actualizarFiltroVisualPantalla();
                    this.configurarInteraccionCanvas();
                    if (this.recuadrosActuales.length === this.totalRangos) this.redibujarRecuadrosEnPantalla();
                    this.actualizarUIformulario();
                } catch (e) { alert("No se pudo iniciar la cámara."); }
            }

            apagarCamara() {
                if (this.streamCamara) {
                    this.streamCamara.getTracks().forEach(t => t.stop());
                    this.streamCamara = null;
                }
                const v = document.getElementById(`cam-video`);
                if (v) v.srcObject = null;
            }

            resetZoom() {
                this.scale = 1; this.panX = 0; this.panY = 0;
                document.getElementById(`wrapper-${this.id}`).style.transform = `translate(0px, 0px) scale(1)`;
            }

            configurarInteraccionCanvas() {
                const container = document.getElementById(`container-${this.id}`);
                const wrapper = document.getElementById(`wrapper-${this.id}`);
                const selectionBox = document.getElementById(`sel-box-${this.id}`);
                const zoomBox = document.getElementById(`zoom-box-${this.id}`);

                container.onwheel = (e) => {
                    e.preventDefault();
                    if (!this.mediaElement) return;
                    let rect = container.getBoundingClientRect();
                    let mX = e.clientX - rect.left, mY = e.clientY - rect.top;
                    let oldS = this.scale;
                    this.scale = Math.max(0.5, Math.min(e.deltaY < 0 ? this.scale * 1.15 : this.scale / 1.15, 15));
                    this.panX = mX - (mX - this.panX) * (this.scale / oldS);
                    this.panY = mY - (mY - this.panY) * (this.scale / oldS);
                    wrapper.style.transform = `translate(${this.panX}px, ${this.panY}px) scale(${this.scale})`;
                };

                container.onmousedown = (e) => {
                    if (!this.mediaElement) return;
                    if (e.button === 0) {
                        if (this.modoActual === 'navegar') {
                            this.isDraggingImage = true;
                            this.startPanX = e.clientX - this.panX; this.startPanY = e.clientY - this.panY;
                            document.addEventListener('mousemove', onMM); document.addEventListener('mouseup', onMU);
                            e.preventDefault(); return;
                        }
                        if (this.recuadrosActuales.length >= this.totalRangos && this.modoActual === 'seleccionar') return;

                        let rect = wrapper.getBoundingClientRect();
                        this.startX = (e.clientX - rect.left) / this.scale;
                        this.startY = (e.clientY - rect.top) / this.scale;
                        this.isDrawing = true;

                        let activeB = this.modoActual === 'zoom-area' ? zoomBox : selectionBox;
                        activeB.style.left = this.startX + 'px'; activeB.style.top = this.startY + 'px';
                        activeB.style.width = '0px'; activeB.style.height = '0px'; activeB.style.display = 'block';
                        document.addEventListener('mousemove', onMM); document.addEventListener('mouseup', onMU);
                        e.preventDefault();
                    }
                };

                const onMM = (e) => {
                    if (this.isDraggingImage) {
                        this.panX = e.clientX - this.startPanX; this.panY = e.clientY - this.startPanY;
                        wrapper.style.transform = `translate(${this.panX}px, ${this.panY}px) scale(${this.scale})`;
                        return;
                    }
                    if (!this.isDrawing) return;
                    let rect = wrapper.getBoundingClientRect();
                    let curX = (e.clientX - rect.left) / this.scale, curY = (e.clientY - rect.top) / this.scale;
                    let w = curX - this.startX, h = curY - this.startY;
                    let activeB = this.modoActual === 'zoom-area' ? zoomBox : selectionBox;
                    activeB.style.width = Math.abs(w) + 'px'; activeB.style.height = Math.abs(h) + 'px';
                    activeB.style.left = (w < 0 ? curX : this.startX) + 'px';
                    activeB.style.top = (h < 0 ? curY : this.startY) + 'px';
                };

                const onMU = () => {
                    document.removeEventListener('mousemove', onMM); document.removeEventListener('mouseup', onMU);
                    if (this.isDraggingImage) { this.isDraggingImage = false; return; }
                    if (!this.isDrawing) return;
                    this.isDrawing = false;

                    if (this.modoActual === 'zoom-area') {
                        zoomBox.style.display = 'none';
                        let w = parseFloat(zoomBox.style.width), h = parseFloat(zoomBox.style.height);
                        if (w > 5 && h > 5) {
                            let bx = parseFloat(zoomBox.style.left), by = parseFloat(zoomBox.style.top);
                            this.scale = Math.max(1, Math.min(Math.min(container.clientWidth/w, container.clientHeight/h), 15));
                            this.panX = -bx * this.scale + (container.clientWidth - w * this.scale) / 2;
                            this.panY = -by * this.scale + (container.clientHeight - h * this.scale) / 2;
                            wrapper.style.transform = `translate(${this.panX}px, ${this.panY}px) scale(${this.scale})`;
                            this.cambiarModo('seleccionar');
                        }
                        return;
                    }

                    selectionBox.style.display = 'none';
                    let w = parseFloat(selectionBox.style.width), h = parseFloat(selectionBox.style.height);
                    if (w > 3 && h > 3 && this.recuadrosActuales.length < this.totalRangos) {
                        let boxData = { left: parseFloat(selectionBox.style.left), top: parseFloat(selectionBox.style.top), width: w, height: h };
                        this.recuadrosActuales.push(boxData);
                        
                        let permBox = document.createElement('div');
                        permBox.className = 'saved-box';
                        permBox.style.left = boxData.left + 'px'; permBox.style.top = boxData.top + 'px';
                        permBox.style.width = boxData.width + 'px'; permBox.style.height = boxData.height + 'px';
                        permBox.innerHTML = `<span>R${this.recuadrosActuales.length}</span>`;
                        wrapper.appendChild(permBox);
                        this.actualizarUIformulario();
                    }
                };
            }

            actualizarUIformulario() {
                let sig = Math.min(this.recuadrosActuales.length + 1, this.totalRangos);
                let el = document.getElementById(`active-box-label-${this.id}`);
                if (el) el.innerText = sig;
            }

            reiniciarRecuadrosActuales() {
                this.recuadrosActuales = [];
                this.limpiarVisualesRecuadros();
                document.getElementById(`sel-box-${this.id}`).style.display = 'none';
                document.getElementById(`zoom-box-${this.id}`).style.display = 'none';
                for (let i = 1; i <= this.totalRangos; i++) {
                    let inp = document.getElementById(`rango-${this.id}-${i}`);
                    if (inp) inp.value = '';
                }
                this.actualizarUIformulario();
            }

            async ejecutarProcesoYpasarSiguiente() {
                if (!this.esCamara && this.listaImagenes.length === 0) return alert("Sube imágenes primero.");
                if (this.recuadrosActuales.length < this.totalRangos) return alert(`Dibuja los ${this.totalRangos} recuadros requeridos.`);

                const foto = this.listaImagenes[this.indiceActual];
                document.getElementById(`loading-status-${this.id}`).innerText = "⏳ Aplicando OpenCV y ejecutando OCR...";

                const scaleX = this.mediaElement.naturalWidth / this.mediaElement.width;
                const scaleY = this.mediaElement.naturalHeight / this.mediaElement.height;
                let resultados = new Array(this.totalRangos).fill('');

                try {
                    const worker = await Tesseract.createWorker('spa+eng');
                    for (let i = 0; i < this.totalRangos; i++) {
                        let b = this.recuadrosActuales[i];
                        let w = b.width * scaleX, h = b.height * scaleY;

                        let canvas = document.createElement('canvas');
                        canvas.width = w; canvas.height = h;
                        let ctx = canvas.getContext('2d');

                        let imgObj = new Image();
                        imgObj.src = foto.src;
                        
                        resultados[i] = await new Promise(resolve => {
                            imgObj.onload = async () => {
                                ctx.drawImage(imgObj, b.left * scaleX, b.top * scaleY, w, h, 0, 0, w, h);
                                let processedDataUrl = this.aplicarMejorasOpenCV(canvas);
                                let ret = await worker.recognize(processedDataUrl);
                                resolve(ret.data.text.trim().replace(/\s+/g, ' '));
                            };
                        });
                        document.getElementById(`rango-${this.id}-${i+1}`).value = resultados[i];
                    }
                    await worker.terminate();

                    let rowData = { "Archivo": foto.name, "R0": document.getElementById(`rango-${this.id}-0`).value.trim() };
                    for (let i = 0; i < this.totalRangos; i++) rowData[`R${i+1}`] = resultados[i];
                    this.tablaData.push(rowData);
                    this.renderizarTablaHTML();

                    document.getElementById(`rango-${this.id}-0`).value = '';
                    setTimeout(() => {
                        this.indiceActual++;
                        if (this.indiceActual < this.listaImagenes.length) this.mostrarFotoActual();
                        else document.getElementById(`loading-status-${this.id}`).innerText = "🏁 ¡Lote finalizado!";
                    }, 500);
                } catch (e) { console.error(e); }
            }

            async ejecutarProcesoCamara() {
                if (this.recuadrosActuales.length < this.totalRangos) return alert(`Dibuja los ${this.totalRangos} recuadros requeridos.`);
                if (!this.streamCamara) return alert("Enciende la cámara primero.");

                document.getElementById(`loading-status-${this.id}`).innerText = "⏳ Procesando frame con OpenCV y Tesseract...";
                const videoEl = document.getElementById(`cam-video`);
                const scaleX = (videoEl.videoWidth || 1280) / videoEl.clientWidth;
                const scaleY = (videoEl.videoHeight || 720) / videoEl.clientHeight;
                let resultados = new Array(this.totalRangos).fill('');

                try {
                    const worker = await Tesseract.createWorker('spa+eng');
                    for (let i = 0; i < this.totalRangos; i++) {
                        let b = this.recuadrosActuales[i];
                        let w = b.width * scaleX, h = b.height * scaleY;

                        let canvas = document.createElement('canvas');
                        canvas.width = w; canvas.height = h;
                        let ctx = canvas.getContext('2d');
                        
                        ctx.drawImage(videoEl, b.left * scaleX, b.top * scaleY, w, h, 0, 0, w, h);
                        let processedDataUrl = this.aplicarMejorasOpenCV(canvas);

                        let ret = await worker.recognize(processedDataUrl);
                        resultados[i] = ret.data.text.trim().replace(/\s+/g, ' ');
                        document.getElementById(`rango-${this.id}-${i+1}`).value = resultados[i];
                    }
                    await worker.terminate();

                    let rowData = { "Captura / Hora": new Date().toLocaleTimeString(), "R0": document.getElementById(`rango-${this.id}-0`).value.trim() };
                    for (let i = 0; i < this.totalRangos; i++) rowData[`R${i+1}`] = resultados[i];
                    this.tablaData.push(rowData);
                    this.renderizarTablaHTML();

                    document.getElementById(`rango-${this.id}-0`).value = '';
                    document.getElementById(`loading-status-${this.id}`).innerText = "✅ Captura de cámara procesada.";
                } catch (e) { console.error(e); }
            }

            exportarExcel() {
                if (this.tablaData.length === 0) return alert("No hay datos en la tabla.");
                const ws = XLSX.utils.json_to_sheet(this.tablaData);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Datos_OCR");
                XLSX.writeFile(wb, `OCR_${this.id === '1' ? 'LoteFotos' : 'Camara'}.xlsx`);
            }
        }

        const appFotos = new ExtractorOCRApp('1', false);
        const appCamara = new ExtractorOCRApp('2', true);
        window.onload = () => { appFotos.init(); appCamara.init(); };
    </script>
</body>
