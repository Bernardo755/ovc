<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extractor OCR Multimodal (Fotos, Cámara y OpenCV)</title>
    <!-- Tesseract.js para OCR -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <!-- SheetJS (xlsx) para exportar a Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- OpenCV.js -->
    <script async src="https://docs.opencv.org/4.8.0/opencv.js"></script>

    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #cbd5e1;
            --radius: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: var(--primary);
        }

        /* Sistema de Pestañas */
        .tabs-header {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            background: #e2e8f0;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: var(--radius);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
        }

        .tab-content {
            display: none;
            background: var(--bg-card);
            padding: 20px;
            border-radius: var(--radius);
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        .tab-content.active {
            display: block;
        }

        /* Controles y Herramientas */
        .controls-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            margin-bottom: 15px;
            padding: 10px;
            background: #f1f5f9;
            border-radius: var(--radius);
        }

        button, .file-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }

        button:hover, .file-btn:hover {
            background: var(--primary-hover);
        }

        input[type="file"] {
            display: none;
        }

        /* Contenedor del Canvas / Visualizador */
        .viewer-container {
            position: relative;
            width: 100%;
            height: 450px;
            background: #0f172a;
            border-radius: var(--radius);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: grab;
            margin-bottom: 15px;
        }

        .viewer-container:active {
            cursor: grabbing;
        }

        .viewer-wrapper {
            position: absolute;
            transform-origin: 0 0;
            display: inline-block;
        }

        .preview-img, video, canvas {
            display: block;
            max-width: none;
            user-select: none;
        }

        /* Recuadros de Selección */
        .selection-box {
            position: absolute;
            border: 2px dashed #ef4444;
            background: rgba(239, 68, 68, 0.2);
            display: none;
            pointer-events: none;
            z-index: 10;
        }

        .zoom-selection-box {
            position: absolute;
            border: 2px dashed #3b82f6;
            background: rgba(59, 130, 246, 0.2);
            display: none;
            pointer-events: none;
            z-index: 10;
        }

        .saved-box {
            position: absolute;
            border: 2px solid #10b981;
            background: rgba(16, 185, 129, 0.15);
            pointer-events: none;
            z-index: 5;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
        }

        .saved-box span {
            background: #10b981;
            color: white;
            font-size: 10px;
            font-weight: bold;
            padding: 1px 4px;
            border-radius: 2px;
        }

        /* Secciones de formulario y estado */
        .status-banner {
            padding: 10px;
            background: #e2e8f0;
            border-radius: 6px;
            font-weight: 500;
            margin-bottom: 15px;
            font-size: 0.95rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .form-group input {
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.95rem;
        }

        /* Tabla de Resultados */
        .table-container {
            max-height: 250px;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-top: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            text-align: left;
        }

        th, td {
            padding: 8px 12px;
            border-bottom: 1px solid var(--border);
        }

        th {
            background: #f1f5f9;
            position: sticky;
            top: 0;
            z-index: 2;
        }

        .queue-banner {
            display: none;
            justify-content: space-between;
            background: #eff6ff;
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            font-weight: 500;
            color: var(--primary);
        }
    </style>
</head>
<body>

    <h1>Extractor OCR Multimodal Integrado</h1>

    <!-- Pestañas de Navegación -->
    <div class="tabs-header">
        <button class="tab-btn active" onclick="cambiarPestaña(event, 'tab-lote')">📁 Lote de Fotos</button>
        <button class="tab-btn" onclick="cambiarPestaña(event, 'tab-camara')">📷 Cámara en Vivo</button>
        <button class="tab-btn" onclick="cambiarPestaña(event, 'tab-opencv')">✨ OpenCV & Filtros</button>
    </div>

    <!-- PESTAÑA 1: Lote de Fotos -->
    <div id="tab-lote" class="tab-content active">
        <div class="controls-toolbar">
            <label class="file-btn">
                📂 Cargar Fotos <input type="file" id="input-files-1" multiple accept="image/*">
            </label>
            <button onclick="appFotos.cambiarModo('seleccionar')">✏️ Dibujar Rango <span id="active-box-label-1">1</span></button>
            <button onclick="appFotos.cambiarModo('zoom-area')">🔍 Zoom Área</button>
            <button onclick="appFotos.cambiarModo('navegar')">✋ Navegar/Mover</button>
            <button onclick="appFotos.resetZoom()">🔄 Restablecer Zoom</button>
            <button onclick="appFotos.reiniciarRecuadrosActuales()">🔄 Reubicar Recuadros</button>
            <button onclick="appFotos.ejecutarProcesoYpasarSiguiente()" style="background: #10b981;">▶️ Procesar y Siguiente</button>
        </div>

        <div id="queue-banner-1" class="queue-banner">
            <span id="queue-text-1">Foto 0 de 0</span>
            <span id="current-filename-1">📁 Ninguna</span>
        </div>

        <div id="loading-status-1" class="status-banner">Esperando carga de imágenes...</div>

        <div id="container-1" class="viewer-container">
            <div id="wrapper-1" class="viewer-wrapper">
                <img id="preview-img-1" class="preview-img" alt="Vista previa">
                <div id="sel-box-1" class="selection-box"></div>
                <div id="zoom-box-1" class="zoom-selection-box"></div>
            </div>
        </div>

        <div class="form-grid" id="form-inputs-1">
            <div class="form-group"><label>Campo Libre (R0)</label><input type="text" id="rango-1-0"></div>
            <div class="form-group"><label>Recuadro 1</label><input type="text" id="rango-1-1" readonly></div>
            <div class="form-group"><label>Recuadro 2</label><input type="text" id="rango-1-2" readonly></div>
            <div class="form-group"><label>Recuadro 3</label><input type="text" id="rango-1-3" readonly></div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center;">
            <button onclick="appFotos.exportarExcel()" style="background: #059669;">📊 Exportar a Excel</button>
            <div>
                <button onclick="appFotos.cambiarFoto(-1)">◀ Anterior</button>
                <button onclick="appFotos.cambiarFoto(1)">Siguiente ▶</button>
            </div>
        </div>

        <div class="table-container">
            <table id="tabla-resultados-1">
                <thead>
                    <tr><th>Archivo</th><th>R0</th><th>R1</th><th>R2</th><th>R3</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <!-- PESTAÑA 2: Cámara en Vivo -->
    <div id="tab-camara" class="tab-content">
        <div class="controls-toolbar">
            <select id="select-camara" style="padding: 6px; border-radius: 6px; border: 1px solid var(--border);"></select>
            <button onclick="appCamara.iniciarCamara()">📷 Encender Cámara</button>
            <button onclick="appCamara.apagarCamara()" style="background: #ef4444;">⏹️ Apagar</button>
            <button onclick="appCamara.cambiarModo('seleccionar')">✏️ Dibujar Rango <span id="active-box-label-2">1</span></button>
            <button onclick="appCamara.cambiarModo('zoom-area')">🔍 Zoom Área</button>
            <button onclick="appCamara.cambiarModo('navegar')">✋ Navegar/Mover</button>
            <button onclick="appCamara.resetZoom()">🔄 Restablecer Zoom</button>
            <button onclick="appCamara.reiniciarRecuadrosActuales()">🔄 Reubicar Recuadros</button>
            <button onclick="appCamara.ejecutarProcesoCamara()" style="background: #10b981;">📸 Capturar y Procesar OCR</button>
        </div>

        <div id="loading-status-2" class="status-banner">Cámara apagada.</div>

        <div id="container-2" class="viewer-container">
            <div id="wrapper-2" class="viewer-wrapper">
                <video id="cam-video" autoplay playsinline></video>
                <div id="sel-box-2" class="selection-box"></div>
                <div id="zoom-box-2" class="zoom-selection-box"></div>
            </div>
        </div>

        <div class="form-grid" id="form-inputs-2">
            <div class="form-group"><label>Campo Libre (R0)</label><input type="text" id="rango-2-0"></div>
            <div class="form-group"><label>Recuadro 1</label><input type="text" id="rango-2-1" readonly></div>
            <div class="form-group"><label>Recuadro 2</label><input type="text" id="rango-2-2" readonly></div>
            <div class="form-group"><label>Recuadro 3</label><input type="text" id="rango-2-3" readonly></div>
        </div>

        <button onclick="appCamara.exportarExcel()" style="background: #059669;">📊 Exportar a Excel</button>

        <div class="table-container">
            <table id="tabla-resultados-2">
                <thead>
                    <tr><th>Captura / Hora</th><th>R0</th><th>R1</th><th>R2</th><th>R3</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <!-- PESTAÑA 3: OpenCV & Filtros -->
    <div id="tab-opencv" class="tab-content">
        <div class="controls-toolbar">
            <label class="file-btn">
                📂 Cargar Imagen <input type="file" id="input-opencv-file" accept="image/*">
            </label>
            <button onclick="procesarConOpenCV()" style="background: #8b5cf6;">⚙️ Aplicar Filtros OpenCV</button>
        </div>

        <div class="status-banner" id="opencv-status">Carga una imagen para aplicar filtros y control de luz con OpenCV.js</div>

        <!-- Controles de Luz y Filtros en tiempo real -->
        <div class="form-grid" style="margin-bottom: 15px; background: #f1f5f9; padding: 10px; border-radius: var(--radius);">
            <div class="form-group">
                <label>Brillo: <span id="val-brillo">0</span></label>
                <input type="range" id="range-brillo" min="-100" max="100" value="0" oninput="procesarConOpenCV()">
            </div>
            <div class="form-group">
                <label>Contraste: <span id="val-contraste">1</span></label>
                <input type="range" id="range-contraste" min="0.5" max="3" step="0.1" value="1" oninput="procesarConOpenCV()">
            </div>
            <div class="form-group">
                <label>Filtro / Umbral:</label>
                <select id="select-filtro" onchange="procesarConOpenCV()" style="padding: 8px; border-radius: 6px; border: 1px solid var(--border);">
                    <option value="gris">Escala de Grises</option>
                    <option value="otsu">Binarización Otsu (Óptimo OCR)</option>
                    <option value="adaptativo">Umbral Adaptativo</option>
                </select>
            </div>
        </div>

        <div style="display: flex; gap: 20px; justify-content: center; flex-wrap: wrap;">
            <div>
                <h4 style="text-align: center; margin-bottom: 5px;">Original</h4>
                <canvas id="canvas-original" style="max-width: 100%; border: 1px solid var(--border); border-radius: 6px;"></canvas>
            </div>
            <div>
                <h4 style="text-align: center; margin-bottom: 5px;">Procesado (OpenCV)</h4>
                <canvas id="canvas-procesado" style="max-width: 100%; border: 1px solid var(--border); border-radius: 6px;"></canvas>
            </div>
        </div>
    </div>

    <!-- Script de Lógica General -->
    <script>
        function cambiarPestaña(evt, tabId) {
            const contents = document.querySelectorAll('.tab-content');
            contents.forEach(c => c.classList.remove('active'));

            const buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach(b => b.classList.remove('active'));

            document.getElementById(tabId).classList.add('active');
            evt.currentTarget.classList.add('active');
        }

        // Lógica de OpenCV para la Pestaña 3
        let imagenOriginalCV = null;

        document.getElementById('input-opencv-file').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    const canvasOrig = document.getElementById('canvas-original');
                    const ctx = canvasOrig.getContext('2d');
                    canvasOrig.width = img.width > 600 ? 600 : img.width;
                    canvasOrig.height = (img.height * canvasOrig.width) / img.width;
                    ctx.drawImage(img, 0, 0, canvasOrig.width, canvasOrig.height);

                    // Cargar en OpenCV
                    if (typeof cv !== 'undefined' && cv.Mat) {
                        imagenOriginalCV = cv.imread(canvasOrig);
                        procesarConOpenCV();
                        document.getElementById('opencv-status').innerText = "✅ Imagen cargada y procesada con OpenCV.";
                    } else {
                        document.getElementById('opencv-status').innerText = "⏳ OpenCV.js aún está cargando, por favor espera un momento...";
                    }
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        function procesarConOpenCV() {
            if (!imagenOriginalCV) return;

            const brillo = parseInt(document.getElementById('range-brillo').value);
            const contraste = parseFloat(document.getElementById('range-contraste').value);
            const tipoFiltro = document.getElementById('select-filtro').value;

            document.getElementById('val-brillo').innerText = brillo;
            document.getElementById('val-contraste').innerText = contraste;

            let src = imagenOriginalCV.clone();
            let dst = new cv.Mat();

            // Aplicar Brillo y Contraste: g(x) = alpha * f(x) + beta
            src.convertTo(dst, -1, contraste, brillo);

            // Convertir a grises
            let gray = new cv.Mat();
            cv.cvtColor(dst, gray, cv.COLOR_RGBA2GRAY, 0);

            let finalMat = new cv.Mat();
            if (tipoFiltro === 'gris') {
                cv.cvtColor(gray, finalMat, cv.COLOR_GRAY2RGBA);
            } else if (tipoFiltro === 'otsu') {
                cv.threshold(gray, finalMat, 0, 255, cv.THRESH_BINARY + cv.THRESH_OTSU);
                cv.cvtColor(finalMat, finalMat, cv.COLOR_GRAY2RGBA);
            } else if (tipoFiltro === 'adaptativo') {
                cv.adaptiveThreshold(gray, finalMat, 255, cv.ADAPTIVE_THRESH_GAUSSIAN_C, cv.THRESH_BINARY, 11, 2);
                cv.cvtColor(finalMat, finalMat, cv.COLOR_GRAY2RGBA);
            }

            cv.imshow('canvas-procesado', finalMat);

            src.delete();
            dst.delete();
            gray.delete();
            finalMat.delete();
        }

        // Clase Principal de Extractor OCR (Pestañas 1 y 2)
        class ExtractorOCRApp {
            constructor(id, esCamara) {
                this.id = id;
                this.esCamara = esCamara;
                this.listaImagenes = [];
                this.indiceActual = 0;
                this.streamCamara = null;
                this.mediaElement = null;
                this.totalRangos = 3;
                this.recuadrosActuales = [];
                this.tablaData = [];

                this.modoActual = 'seleccionar';
                this.scale = 1;
                this.panX = 0;
                this.panY = 0;
                this.isDrawing = false;
                this.isDraggingImage = false;
                this.startX = 0;
                this.startY = 0;
                this.startPanX = 0;
                this.startPanY = 0;
            }

            init() {
                if (!this.esCamara) {
                    const inputFiles = document.getElementById(`input-files-${this.id}`);
                    inputFiles.addEventListener('change', (e) => this.cargarLoteImagenes(e));
                } else {
                    this.poblarDispositivosCamara();
                }
            }

            async poblarDispositivosCamara() {
                try {
                    const devices = await navigator.mediaDevices.enumerateDevices();
                    const videoDevices = devices.filter(d => d.kind === 'videoinput');
                    const select = document.getElementById(`select-camara`);
                    select.innerHTML = '';
                    videoDevices.forEach((dev, index) => {
                        const opt = document.createElement('option');
                        opt.value = dev.deviceId;
                        opt.innerText = dev.label || `Cámara ${index + 1}`;
                        select.appendChild(opt);
                    });
                } catch (err) {
                    console.error("Error listando cámaras:", err);
                }
            }

            cambiarModo(modo) {
                this.modoActual = modo;
                const statusEl = document.getElementById(`loading-status-${this.id}`);
                if (modo === 'seleccionar') {
                    statusEl.innerText = `✏️ Modo Dibujo activo. Dibuja el recuadro ${this.recuadrosActuales.length + 1}.`;
                } else if (modo === 'zoom-area') {
                    statusEl.innerText = `🔍 Modo Zoom Área activo. Arrastra para acercar una sección.`;
                } else if (modo === 'navegar') {
                    statusEl.innerText = `✋ Modo Navegar activo. Haz clic y arrastra para mover la imagen.`;
                }
            }

            cargarLoteImagenes(e) {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;

                this.listaImagenes = [];
                let cargadas = 0;

                files.forEach((file, idx) => {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        this.listaImagenes.push({
                            name: file.name,
                            src: event.target.result
                        });
                        cargadas++;
                        if (cargadas === files.length) {
                            this.indiceActual = 0;
                            this.mostrarFotoActual();
                        }
                    };
                    reader.readAsDataURL(file);
                });
            }

            mostrarFotoActual() {
                if (this.listaImagenes.length === 0) return;
                const foto = this.listaImagenes[this.indiceActual];
                const wrapper = document.getElementById(`wrapper-${this.id}`);

                wrapper.innerHTML = `
                    <img id="preview-img-${this.id}" class="preview-img" src="${foto.src}" alt="${foto.name}">
                    <div id="sel-box-${this.id}" class="selection-box"></div>
                    <div id="zoom-box-${this.id}" class="zoom-selection-box"></div>
                `;

                // Volver a dibujar los recuadros guardados si existen
                this.redibujarRecuadrosEnPantalla();

                document.getElementById(`queue-banner-${this.id}`).style.display = 'flex';
                document.getElementById(`queue-text-${this.id}`).innerText = `Foto ${this.indiceActual + 1} de ${this.listaImagenes.length}`;
                document.getElementById(`current-filename-${this.id}`).innerText = `📁 ${foto.name}`;

                this.mediaElement = document.getElementById(`preview-img-${this.id}`);

                this.mediaElement.onload = () => {
                    this.resetZoom();
                    this.configurarInteraccionCanvas();
                    
                    if (this.recuadrosActuales.length === this.totalRangos) {
                        document.getElementById(`loading-status-${this.id}`).innerText = `✅ Foto cargada. Usando ${this.totalRangos} recuadros guardados previamente.`;
                    } else {
                        document.getElementById(`loading-status-${this.id}`).innerText = `✏️ Dibuja los recuadros (${this.recuadrosActuales.length}/${this.totalRangos}).`;
                    }
                    this.actualizarUIformulario();
                };
            }

            cambiarFoto(dir) {
                if (this.listaImagenes.length === 0) return;
                this.indiceActual += dir;
                if (this.indiceActual < 0) this.indiceActual = 0;
                if (this.indiceActual >= this.listaImagenes.length) this.indiceActual = this.listaImagenes.length - 1;
                this.mostrarFotoActual();
            }

            redibujarRecuadrosEnPantalla() {
                const wrapper = document.getElementById(`wrapper-${this.id}`);
                // Limpiar recuadros visuales anteriores
                const oldBoxes = wrapper.querySelectorAll('.saved-box');
                oldBoxes.forEach(b => b.remove());

                this.recuadrosActuales.forEach((boxData, idx) => {
                    const permBox = document.createElement('div');
                    permBox.className = 'saved-box';
                    permBox.style.left = boxData.left + 'px';
                    permBox.style.top = boxData.top + 'px';
                    permBox.style.width = boxData.width + 'px';
                    permBox.style.height = boxData.height + 'px';
                    permBox.innerHTML = `<span>R${idx + 1}</span>`;
                    wrapper.appendChild(permBox);
                });
            }

            limpiarVisualesRecuadros() {
                const wrapper = document.getElementById(`wrapper-${this.id}`);
                const oldBoxes = wrapper.querySelectorAll('.saved-box');
                oldBoxes.forEach(b => b.remove());
            }

            async iniciarCamara() {
                try {
                    this.apagarCamara();
                    const selectCam = document.getElementById(`select-camara`);
                    const deviceIdSelected = selectCam.value;

                    const constraints = {
                        video: deviceIdSelected ? { deviceId: { exact: deviceIdSelected } } : { width: { ideal: 1280 }, height: { ideal: 720 } }
                    };

                    this.streamCamara = await navigator.mediaDevices.getUserMedia(constraints);
                    this.mediaElement = document.getElementById(`cam-video`);
                    this.mediaElement.srcObject = this.streamCamara;
                    
                    this.resetZoom();
                    this.configurarInteraccionCanvas();

                    if (this.recuadrosActuales.length === this.totalRangos) {
                        this.redibujarRecuadrosEnPantalla();
                        document.getElementById(`loading-status-${this.id}`).innerText = "✅ Cámara activa. Usando recuadros guardados.";
                    } else {
                        document.getElementById(`loading-status-${this.id}`).innerText = `✏️ Cámara activa. Dibuja los recuadros (${this.recuadrosActuales.length}/${this.totalRangos}).`;
                    }
                    this.actualizarUIformulario();
                } catch (err) {
                    console.error(err);
                    alert("No se pudo iniciar la cámara seleccionada.");
                }
            }

            apagarCamara() {
                if (this.streamCamara) {
                    this.streamCamara.getTracks().forEach(track => track.stop());
                    this.streamCamara = null;
                }
                const videoEl = document.getElementById(`cam-video`);
                if (videoEl) videoEl.srcObject = null;
                document.getElementById(`loading-status-${this.id}`).innerText = "⏹️ Cámara apagada.";
            }

            resetZoom() {
                this.scale = 1;
                this.panX = 0;
                this.panY = 0;
                this.actualizarTransformacionCanvas();
            }

            actualizarTransformacionCanvas() {
                const wrapper = document.getElementById(`wrapper-${this.id}`);
                if (wrapper) {
                    wrapper.style.transform = `translate(${this.panX}px, ${this.panY}px) scale(${this.scale})`;
                }
            }

            configurarInteraccionCanvas() {
                const container = document.getElementById(`container-${this.id}`);
                const wrapper = document.getElementById(`wrapper-${this.id}`);
                const selectionBox = document.getElementById(`sel-box-${this.id}`);
                const zoomBox = document.getElementById(`zoom-box-${this.id}`);

                container.onwheel = (e) => {
                    e.preventDefault();
                    if (!this.mediaElement) return;

                    const rect = container.getBoundingClientRect();
                    const mouseX = e.clientX - rect.left;
                    const mouseY = e.clientY - rect.top;

                    const zoomFactor = 1.15;
                    let oldScale = this.scale;

                    if (e.deltaY < 0) {
                        this.scale *= zoomFactor;
                    } else {
                        this.scale /= zoomFactor;
                    }

                    this.scale = Math.max(0.5, Math.min(this.scale, 15));
                    this.panX = mouseX - (mouseX - this.panX) * (this.scale / oldScale);
                    this.panY = mouseY - (mouseY - this.panY) * (this.scale / oldScale);

                    this.actualizarTransformacionCanvas();
                };

                container.onmousedown = (e) => {
                    if (!this.mediaElement) return;

                    if (e.button === 0) {
                        if (this.modoActual === 'navegar') {
                            this.isDraggingImage = true;
                            this.startPanX = e.clientX - this.panX;
                            this.startPanY = e.clientY - this.panY;
                            
                            document.addEventListener('mousemove', onMouseMoveGlobal);
                            document.addEventListener('mouseup', onMouseUpGlobal);
                            e.preventDefault();
                            return;
                        }

                        if (this.recuadrosActuales.length >= this.totalRangos && this.modoActual === 'seleccionar') {
                            return;
                        }

                        const rect = wrapper.getBoundingClientRect();
                        this.startX = (e.clientX - rect.left) / this.scale;
                        this.startY = (e.clientY - rect.top) / this.scale;
                        this.isDrawing = true;

                        let activeBox = (this.modoActual === 'zoom-area') ? zoomBox : selectionBox;
                        activeBox.style.left = this.startX + 'px';
                        activeBox.style.top = this.startY + 'px';
                        activeBox.style.width = '0px';
                        activeBox.style.height = '0px';
                        activeBox.style.display = 'block';

                        document.addEventListener('mousemove', onMouseMoveGlobal);
                        document.addEventListener('mouseup', onMouseUpGlobal);
                        e.preventDefault();
                    }
                };

                const onMouseMoveGlobal = (e) => {
                    if (this.isDraggingImage) {
                        this.panX = e.clientX - this.startPanX;
                        this.panY = e.clientY - this.startPanY;
                        this.actualizarTransformacionCanvas();
                        return;
                    }

                    if (!this.isDrawing) return;
                    const rect = wrapper.getBoundingClientRect();
                    let currentX = (e.clientX - rect.left) / this.scale;
                    let currentY = (e.clientY - rect.top) / this.scale;

                    const width = currentX - this.startX;
                    const height = currentY - this.startY;

                    let activeBox = (this.modoActual === 'zoom-area') ? zoomBox : selectionBox;
                    activeBox.style.width = Math.abs(width) + 'px';
                    activeBox.style.height = Math.abs(height) + 'px';
                    activeBox.style.left = (width < 0 ? currentX : this.startX) + 'px';
                    activeBox.style.top = (height < 0 ? currentY : this.startY) + 'px';
                };

                const onMouseUpGlobal = (e) => {
                    document.removeEventListener('mousemove', onMouseMoveGlobal);
                    document.removeEventListener('mouseup', onMouseUpGlobal);

                    if (this.isDraggingImage) {
                        this.isDraggingImage = false;
                        return;
                    }

                    if (!this.isDrawing) return;
                    this.isDrawing = false;

                    if (this.modoActual === 'zoom-area') {
                        const width = parseFloat(zoomBox.style.width);
                        const height = parseFloat(zoomBox.style.height);
                        zoomBox.style.display = 'none';

                        if (width > 5 && height > 5) {
                            const boxLeft = parseFloat(zoomBox.style.left);
                            const boxTop = parseFloat(zoomBox.style.top);
                            const containerWidth = container.clientWidth;
                            const containerHeight = container.clientHeight;

                            const scaleX = containerWidth / width;
                            const scaleY = containerHeight / height;
                            let newScale = Math.min(scaleX, scaleY);
                            newScale = Math.max(1, Math.min(newScale, 15));

                            this.scale = newScale;
                            this.panX = -boxLeft * this.scale + (containerWidth - width * this.scale) / 2;
                            this.panY = -boxTop * this.scale + (containerHeight - height * this.scale) / 2;

                            this.actualizarTransformacionCanvas();
                            this.cambiarModo('seleccionar');
                        }
                        return;
                    }

                    const width = parseFloat(selectionBox.style.width);
                    const height = parseFloat(selectionBox.style.height);
                    selectionBox.style.display = 'none';

                    if (width > 3 && height > 3) {
                        if (this.recuadrosActuales.length >= this.totalRangos) {
                            return;
                        }

                        const boxData = {
                            left: parseFloat(selectionBox.style.left),
                            top: parseFloat(selectionBox.style.top),
                            width: width,
                            height: height
                        };

                        this.recuadrosActuales.push(boxData);

                        const permBox = document.createElement('div');
                        permBox.className = 'saved-box';
                        permBox.style.left = boxData.left + 'px';
                        permBox.style.top = boxData.top + 'px';
                        permBox.style.width = boxData.width + 'px';
                        permBox.style.height = boxData.height + 'px';
                        permBox.innerHTML = `<span>R${this.recuadrosActuales.length}</span>`;
                        wrapper.appendChild(permBox);

                        this.actualizarUIformulario();

                        if (this.recuadrosActuales.length < this.totalRangos) {
                            document.getElementById(`loading-status-${this.id}`).innerText = `✅ Rango ${this.recuadrosActuales.length} guardado en memoria. Falta(n) ${this.totalRangos - this.recuadrosActuales.length}.`;
                        } else {
                            document.getElementById(`loading-status-${this.id}`).innerText = `🎉 ¡${this.totalRangos} recuadros guardados permanentemente!`;
                        }
                    }
                };
            }

            actualizarUIformulario() {
                const siguienteRango = Math.min(this.recuadrosActuales.length + 1, this.totalRangos);
                const labelEl = document.getElementById(`active-box-label-${this.id}`);
                if (labelEl) labelEl.innerText = siguienteRango;
            }

            reiniciarRecuadrosActuales() {
                this.recuadrosActuales = [];
                this.limpiarVisualesRecuadros();
                const selBox = document.getElementById(`sel-box-${this.id}`);
                const zoomBox = document.getElementById(`zoom-box-${this.id}`);
                if (selBox) selBox.style.display = 'none';
                if (zoomBox) zoomBox.style.display = 'none';

                for(let i = 1; i <= this.totalRangos; i++) {
                    const input = document.getElementById(`rango-${this.id}-${i}`);
                    if(input) input.value = '';
                }
                document.getElementById(`loading-status-${this.id}`).innerText = "🔄 MODO REUBICACIÓN: Dibuja los recuadros nuevamente.";
                this.actualizarUIformulario();
            }

            async ejecutarProcesoYpasarSiguiente() {
                if (this.listaImagenes.length === 0) {
                    alert("No hay imágenes cargadas.");
                    return;
                }

                if (this.recuadrosActuales.length < this.totalRangos) {
                    alert(`Debes terminar de dibujar los ${this.totalRangos} recuadros antes de ejecutar el OCR.`);
                    return;
                }

                if (this.indiceActual >= this.listaImagenes.length) {
                    this.indiceActual = 0;
                }

                const foto = this.listaImagenes[this.indiceActual];
                document.getElementById(`loading-status-${this.id}`).innerText = "⏳ Ejecutando OCR en los recuadros guardados...";

                const scaleX = this.mediaElement.naturalWidth / this.mediaElement.width;
                const scaleY = this.mediaElement.naturalHeight / this.mediaElement.height;

                let resultadosOCR = new Array(this.totalRangos).fill('');

                try {
                    const worker = await Tesseract.createWorker('spa+eng');

                    for (let i = 0; i < this.totalRangos; i++) {
                        const b = this.recuadrosActuales[i];
                        const x = b.left * scaleX;
                        const y = b.top * scaleY;
                        const w = b.width * scaleX;
                        const h = b.height * scaleY;

                        const canvas = document.createElement('canvas');
                        canvas.width = w;
                        canvas.height = h;
                        const ctx = canvas.getContext('2d');

                        const imageObj = new Image();
                        imageObj.src = foto.src;
                        
                        const textoRecorte = await new Promise((resolve) => {
                            imageObj.onload = async () => {
                                ctx.drawImage(imageObj, x, y, w, h, 0, 0, w, h);
                                const croppedDataUrl = canvas.toDataURL('image/png');
                                const ret = await worker.recognize(croppedDataUrl);
                                let texto = ret.data.text.trim();
                                
                                texto = texto.replace(/\s*@\s*/g, '@');
                                texto = texto.replace(/\s*\.\s*/g, '.');
                                texto = texto.replace(/([a-zA-Z0-9._%+-])\s+([a-zA-Z0-9._%+-])/g, '$1$2');
                                
                                resolve(texto);
                            };
                        });

                        resultadosOCR[i] = textoRecorte;
                        document.getElementById(`rango-${this.id}-${i+1}`).value = textoRecorte;
                    }

                    await worker.terminate();

                    const valR0 = document.getElementById(`rango-${this.id}-0`).value.trim();

                    let rowData = { "Archivo": foto.name, "R0": valR0 };
                    for (let i = 0; i < this.totalRangos; i++) {
                        rowData[`R${i+1}`] = resultadosOCR[i];
                    }
                    this.tablaData.push(rowData);
                    this.renderizarTablaHTML();

                    document.getElementById(`rango-${this.id}-0`).value = '';
                    document.getElementById(`rango-${this.id}-0`).focus();

                    document.getElementById(`loading-status-${this.id}`).innerText = "✅ ¡Procesado con éxito! Pasando a la siguiente foto...";

                    setTimeout(() => {
                        this.indiceActual++;
                        if (this.indiceActual < this.listaImagenes.length) {
                            this.mostrarFotoActual();
                        } else {
                            this.indiceActual = this.listaImagenes.length - 1;
                            document.getElementById(`loading-status-${this.id}`).innerText = "🏁 ¡Lote completado con éxito!";
                        }
                    }, 1000);

                } catch (err) {
                    console.error(err);
                    document.getElementById(`loading-status-${this.id}`).innerText = "❌ Error al ejecutar el OCR masivo.";
                }
            }

            async ejecutarProcesoCamara() {
                if (this.recuadrosActuales.length < this.totalRangos) {
                    alert(`Debes terminar de dibujar los ${this.totalRangos} recuadros antes de ejecutar el OCR.`);
                    return;
                }

                if (!this.streamCamara) {
                    alert("La cámara no está encendida.");
                    return;
                }

                document.getElementById(`loading-status-${this.id}`).innerText = "⏳ Capturando fotograma de cámara...";

                const videoEl = document.getElementById(`cam-video`);
                const natW = videoEl.videoWidth || 1280;
                const natH = videoEl.videoHeight || 720;
                const clientW = videoEl.clientWidth;
                const clientH = videoEl.clientHeight;

                const scaleX = natW / clientW;
                const scaleY = natH / clientH;

                let resultadosOCR = new Array(this.totalRangos).fill('');

                try {
                    const worker = await Tesseract.createWorker('spa+eng');

                    for (let i = 0; i < this.totalRangos; i++) {
                        const b = this.recuadrosActuales[i];
                        const x = b.left * scaleX;
                        const y = b.top * scaleY;
                        const w = b.width * scaleX;
                        const h = b.height * scaleY;

                        const canvas = document.createElement('canvas');
                        canvas.width = w;
                        canvas.height = h;
                        const ctx = canvas.getContext('2d');

                        ctx.drawImage(videoEl, x, y, w, h, 0, 0, w, h);
                        const croppedDataUrl = canvas.toDataURL('image/png');

                        const ret = await worker.recognize(croppedDataUrl);
                        let texto = ret.data.text.trim();
                        
                        texto = texto.replace(/\s*@\s*/g, '@');
                        texto = texto.replace(/\s*\.\s*/g, '.');
                        texto = texto.replace(/([a-zA-Z0-9._%+-])\s+([a-zA-Z0-9._%+-])/g, '$1$2');

                        resultadosOCR[i] = texto;
                        document.getElementById(`rango-${this.id}-${i+1}`).value = texto;
                    }

                    await worker.terminate();

                    const valR0 = document.getElementById(`rango-${this.id}-0`).value.trim();
                    const timestamp = new Date().toLocaleTimeString();
                    
                    let rowData = { "Captura / Hora": timestamp, "R0": valR0 };
                    for (let i = 0; i < this.totalRangos; i++) {
                        rowData[`R${i+1}`] = resultadosOCR[i];
                    }
                    this.tablaData.push(rowData);
                    this.renderizarTablaHTML();

                    document.getElementById(`rango-${this.id}-0`).value = '';
                    document.getElementById(`rango-${this.id}-0`).focus();

                    document.getElementById(`loading-status-${this.id}`).innerText = "✅ ¡OCR de cámara completado con éxito!";

                } catch (err) {
                    console.error(err);
                    document.getElementById(`loading-status-${this.id}`).innerText = "❌ Error al procesar el OCR de la cámara.";
                }
            }

            renderizarTablaHTML() {
                const tbody = document.querySelector(`#tabla-resultados-${this.id} tbody`);
                tbody.innerHTML = '';

                this.tablaData.forEach(row => {
                    const tr = document.createElement('tr');
                    const keys = Object.keys(row);
                    keys.forEach(k => {
                        const td = document.createElement('td');
                        td.innerText = row[k];
                        tr.appendChild(td);
                    });
                    tbody.appendChild(tr);
                });
            }

            exportarExcel() {
                if (this.tablaData.length === 0) {
                    alert("La tabla está vacía.");
                    return;
                }
                const worksheet = XLSX.utils.json_to_sheet(this.tablaData);
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, "OCR_Datos");
                XLSX.writeFile(workbook, `Datos_OCR_${this.id === '1' ? 'LoteFotos' : 'Camara'}.xlsx`);
            }
        }

        const appFotos = new ExtractorOCRApp('1', false);
        const appCamara = new ExtractorOCRApp('2', true);

        window.onload = function() {
            appFotos.init();
            appCamara.init();
        }
    </script>
</body>
